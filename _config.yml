title: MTL Basketball
description: >-
  MTL Basketball is part of the Mountain Top League, an all-volunteer organization
  serving the children of West Orange, NJ since 1959.
# Served at the basketball subdomain; the CNAME file at the repo root rides the
# deploy to gh-pages, where GitHub Pages picks the domain up. Old
# siliconsaga.github.io/mtl-basketball/ URLs redirect here automatically.
url: "https://basketball.mountaintopleague.com"
baseurl: ""

# Base for the "Suggest an edit" button on every page: the page's source path
# is appended, landing in GitHub's editor for that file.
github_edit_base: "https://github.com/SiliconSaga/mtl-basketball/edit/main/"

permalink: pretty
markdown: kramdown

sass:
  sass_dir: _sass
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor

defaults:
  - scope:
      path: ""
    values:
      layout: page
