title: MTL Basketball
description: >-
  MTL Basketball is part of the Mountain Top League, an all-volunteer organization
  serving the children of West Orange, NJ since 1959.
# Served from the SiliconSaga Pages path until the basketball subdomain is
# wired up. The subdomain flip is a later PR: add the CNAME file and set
# url to https://basketball.mountaintopleague.com with an empty baseurl.
url: "https://siliconsaga.github.io"
baseurl: "/mtl-basketball"

# Base for the "Suggest an edit" button on every page: the page's source path
# is appended, landing in GitHub's editor for that file.
github_edit_base: "https://github.com/SiliconSaga/mtl-basketball/edit/main/"

permalink: pretty
markdown: kramdown

sass:
  sass_dir: _sass
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor

defaults:
  - scope:
      path: ""
    values:
      layout: page
