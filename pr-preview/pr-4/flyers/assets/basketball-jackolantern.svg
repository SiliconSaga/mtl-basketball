<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" role="img" aria-label="Basketball carved like a jack-o'-lantern">
  <!-- The kit's basketball.svg with a stem on top and a friendly carved face
       glowing from inside: Halloween without anything scary for little kids. -->
  <defs>
    <radialGradient id="ball" cx="36%" cy="30%" r="78%">
      <stop offset="0" stop-color="#FFB466"/>
      <stop offset="0.45" stop-color="#F0821E"/>
      <stop offset="1" stop-color="#9E4A0E"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#FFF6B0"/>
      <stop offset="0.55" stop-color="#FFD23F"/>
      <stop offset="1" stop-color="#FF9A1F"/>
    </radialGradient>
    <radialGradient id="shine" cx="32%" cy="26%" r="30%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="edge"><circle cx="100" cy="120" r="95"/></clipPath>
  </defs>
  <path d="M96 30 C94 18 98 8 108 2 C112 6 110 10 106 14 C103 19 104 25 106 30 Z" fill="#3E7B2A" stroke="#1F3D14" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="100" cy="120" r="96" fill="url(#ball)" stroke="#2B1508" stroke-width="3"/>
  <g clip-path="url(#edge)" fill="none" stroke="#2B1508" stroke-width="4.5" stroke-linecap="round" opacity="0.55">
    <path d="M100 22 V218"/>
    <path d="M22 54 Q98 120 22 186"/>
    <path d="M178 54 Q102 120 178 186"/>
  </g>
  <g fill="url(#glow)" stroke="#2B1508" stroke-width="3" stroke-linejoin="round">
    <path d="M52 108 L74 74 L96 108 Z"/>
    <path d="M104 108 L126 74 L148 108 Z"/>
    <path d="M92 132 L100 118 L108 132 Z"/>
    <path d="M40 146 Q100 206 160 146 L146 152 L136 166 L124 156 L112 172 L100 158 L88 172 L76 156 L64 166 L54 152 Z"/>
  </g>
  <circle cx="100" cy="120" r="95" fill="url(#shine)"/>
</svg>
